services:
  app:
    build: .
    image: radiocalico:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      STREAM_URL: ${STREAM_URL:-https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8}
      # Keep "true" behind HTTPS; set to "false" only when serving over plain HTTP
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Behind a reverse proxy on a private network, use "uniquelocal" (or the proxy's IP)
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
    volumes:
      - radiocalico-data:/data
    # Allow in-flight requests to finish before the container is killed
    stop_grace_period: 15s

volumes:
  radiocalico-data:
