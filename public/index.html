<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Calico</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="logo" aria-hidden="true"></div>
      <h1>Radio Calico</h1>
    </header>

    <section class="card" aria-labelledby="np-label">
      <div class="now">
        <img id="cover" class="cover" alt="">
        <div>
          <div id="np-label" class="label">Now Playing</div>
          <h2 id="title" class="title">Loading…</h2>
          <p id="artist" class="artist"></p>
          <p id="album" class="album"></p>
          <div class="progress" aria-hidden="true"><div id="bar"></div></div>
          <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>

          <div class="rating" role="group" aria-label="Rate this song">
            <button id="vote-up" class="vote vote-up" aria-pressed="false" aria-label="I like this song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v11H3V10zm2 11V10l4.5-7.5c1.4 0 2.5 1.1 2.5 2.5v4h4.5c1.2 0 2.1 1.1 1.9 2.3l-1.4 8A2 2 0 0 1 19 21z"/></svg>
              <span id="up-count">0</span>
            </button>
            <button id="vote-down" class="vote vote-down" aria-pressed="false" aria-label="I don’t like this song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 14V3h4v11zm-2-11v11l-4.5 7.5C9.1 21.5 8 20.4 8 19v-4H3.5c-1.2 0-2.1-1.1-1.9-2.3l1.4-8A2 2 0 0 1 5 3z"/></svg>
              <span id="down-count">0</span>
            </button>
            <div class="rating-info">
              <div class="approval" hidden><div id="approval"></div></div>
              <p id="rating-feedback" class="rating-feedback" aria-live="polite"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="player">
        <button id="play" class="play" aria-label="Play live stream">
          <svg id="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <span id="live" class="badge">LIVE</span>
        <span id="status" class="status" aria-live="polite">Press play to start listening</span>
        <label class="volume">Volume
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
        </label>
      </div>
      <audio id="audio" preload="none"></audio>
    </section>

    <div class="lists">
      <section class="card">
        <h2>Up Next</h2>
        <div id="next"></div>
      </section>
      <section class="card">
        <h2>Recently Played</h2>
        <div id="recent"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
